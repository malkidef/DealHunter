name: Collecte quotidienne TED Europe

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ted-feed-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les avis TED officiels
        run: python3 scripts/collect_ted.py
      - name: Publier le flux TED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ted-buyer-opportunities.json
          if git diff --cached --quiet; then
            echo "Aucune modification du flux TED."
          else
            git commit -m "Mise à jour quotidienne des opportunités TED"
            git push
          fi
