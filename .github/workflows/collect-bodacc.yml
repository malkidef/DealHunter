name: Collecte quotidienne BODACC

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealhunter-feed-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester les connecteurs
        run: python -m unittest discover -s tests -v
      - name: Collecter les avis officiels BODACC
        run: python scripts/collect_bodacc.py
      - name: Publier le flux public de consultation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bodacc-business-sales.json
          if git diff --cached --quiet; then
            echo "Aucune modification du flux BODACC."
          else
            git commit -m "Mise à jour quotidienne du flux BODACC"
            git push
          fi
