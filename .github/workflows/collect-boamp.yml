name: Collecte quotidienne BOAMP

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Collecter les avis BOAMP officiels
        run: python3 scripts/collect_boamp.py
      - name: Publier le flux BOAMP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boamp-buyer-opportunities.json
          if git diff --cached --quiet; then
            echo "Aucune modification du flux BOAMP."
          else
            git commit -m "Mise à jour quotidienne des opportunités BOAMP"
            git push
          fi
