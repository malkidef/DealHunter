name: DealHunter — déployer uniquement Firestore

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Saisir exactement dealhunter-3747b pour autoriser le déploiement"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dealhunter-firestore-production-deploy
  cancel-in-progress: false

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier la confirmation du projet et le secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
        run: |
          if [ "$CONFIRM_PROJECT" != "dealhunter-3747b" ]; then
            echo "::error::Confirmation du projet incorrecte ; aucun déploiement effectué."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT absent."
            exit 1
          fi
          node -e 'const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); if(!x.project_id || !x.client_email || !x.private_key) process.exit(1); if(x.project_id !== "dealhunter-3747b") { console.error("Le compte de service ne correspond pas au projet cible."); process.exit(1); }'
      - name: Identifier le compte de service utilisé (adresse uniquement)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e 'const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log("Compte de service utilisé :", x.client_email)'
      - name: Préparer l'identité Firebase temporaire
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/dealhunter-firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/dealhunter-firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/dealhunter-firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Déployer uniquement les règles et index Firestore
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project dealhunter-3747b --non-interactive
      - name: Nettoyer le fichier d'identité temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/dealhunter-firebase-service-account.json"
