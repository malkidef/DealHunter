name: Tests DealHunter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests Python
        run: python -m unittest discover -s tests -v
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exécuter les tests du moteur de matching
        run: node --test tests/test_matching.js
      - name: Vérifier les fonctions Firebase
        run: |
          node --check firebase/functions/src/index.js
          node --check firebase/functions/src/payments.js
      - name: Vérifier le JavaScript de l’application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Un seul script intégré attendu, trouvé : {len(scripts)}")
          Path("/tmp/dealhunter.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/dealhunter.js
