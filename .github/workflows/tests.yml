name: Tests Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v
      - name: Vérifier le JavaScript de l’application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Un seul script intégré attendu, trouvé : {len(scripts)}")
          Path("/tmp/dealhunter.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/dealhunter.js
