name: Tests DealHunter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier la syntaxe YAML des workflows GitHub Actions
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |file| YAML.load_file(file, aliases: true); puts "YAML valide : #{file}" }'
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests Python
        run: python -m unittest discover -s tests -v
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Exécuter les tests du moteur de matching
        run: node --test tests/test_matching.js tests/test_frontend_matching.js tests/test_firestore_adapter.js tests/test_service_matching.js tests/test_work_matching.js tests/test_listing_dedupe.js tests/test_ui_navigation.js
      - name: Vérifier les fonctions Firebase
        run: |
          node --check functions/matching/src/firestore-adapter.js
          node --check functions/matching/src/service-matching.js
          node --check functions/matching/src/work-matching.js
          node --check functions/matching/src/listing-dedupe.js
          node --check firebase/functions/src/matching-batch.js
          node --check firebase/functions/src/notification-batch.js
          node --check firebase/functions/src/index.js
          node --check firebase/functions/src/payments.js
      - name: Vérifier le JavaScript de l’application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if not scripts:
              raise SystemExit("Aucun script intégré trouvé")
          for index, script in enumerate(scripts):
              Path(f"/tmp/dealhunter-inline-{index}.js").write_text(script, encoding="utf-8")
          PY
          for script_file in /tmp/dealhunter-inline-*.js; do
            node --check "$script_file"
          done
          cp auth.js /tmp/auth.mjs
          node --check /tmp/auth.mjs
