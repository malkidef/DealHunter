name: GSA Auctions (exécution manuelle)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-gsa-auctions:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester le connecteur
        run: python -m unittest discover -s tests -v

      - name: Récupérer les annonces GSA
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: python scripts/gsa_auctions.py --output output/gsa-auctions-pending.json

      - name: Joindre le fichier de revue
        uses: actions/upload-artifact@v4
        with:
          name: gsa-auctions-pending
          path: output/gsa-auctions-pending.json
          retention-days: 14
