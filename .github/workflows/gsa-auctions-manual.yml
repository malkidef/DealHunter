name: GSA Auctions (automatique + manuel)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 */2 * *"

permissions:
  contents: write

concurrency:
  group: dealhunter-feed-publication
  cancel-in-progress: false

jobs:
  fetch-gsa-auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester le connecteur
        run: python -m unittest discover -s tests -v

      - name: Récupérer les annonces GSA
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: python scripts/gsa_auctions.py --output output/gsa-auctions-pending.json

      - name: Publier le flux public de consultation
        run: |
          mkdir -p data
          cp output/gsa-auctions-pending.json data/gsa-auctions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsa-auctions.json
          if git diff --cached --quiet; then
            echo "Le flux public est déjà à jour."
          else
            git commit -m "Update published GSA listings feed"
            git push
          fi

      - name: Joindre le fichier de revue
        uses: actions/upload-artifact@v4
        with:
          name: gsa-auctions-pending
          path: output/gsa-auctions-pending.json
          retention-days: 14
